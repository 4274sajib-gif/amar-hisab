<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>আমার হিসাব</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f6f5;
  color:#202522;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#e7f5ef 0%,#f4f6f5 45%,#eef2f0 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.login-box{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:24px;
  padding:28px 22px 24px;
  box-shadow:
    0 8px 0 #dce6e1,
    0 18px 35px rgba(0,0,0,.12);
}

.login-logo{
  width:68px;
  height:68px;
  margin:0 auto 14px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  color:#fff;
  font-size:34px;
  font-weight:900;

  background:
    linear-gradient(145deg,#15906d,#0b6b4f 55%,#07523d);

  box-shadow:
    0 4px 0 #064735,
    0 9px 18px rgba(11,107,79,.25),
    inset 0 1px 0 rgba(255,255,255,.30);
}

.login-title{
  text-align:center;
  font-size:25px;
  font-weight:900;
  color:#0b6b4f;
  margin-bottom:5px;
}

.login-subtitle{
  text-align:center;
  font-size:12px;
  color:#7b8580;
  margin-bottom:24px;
}

.login-input{
  width:100%;
  height:48px;
  border:1px solid #dce5e1;
  border-radius:13px;
  padding:0 14px;
  outline:none;
  background:#f8faf9;
  font-size:14px;
  margin-bottom:11px;
}

.login-input:focus{
  border-color:#0b6b4f;
  background:#fff;
  box-shadow:0 0 0 3px rgba(11,107,79,.08);
}

.login-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:13px;

  color:#fff;
  background:linear-gradient(145deg,#14906c,#0b6b4f);

  font-size:15px;
  font-weight:800;

  box-shadow:
    0 3px 0 #064735,
    0 7px 14px rgba(11,107,79,.18);
}

.login-btn:active{
  transform:translateY(2px);
  box-shadow:
    0 1px 0 #064735,
    0 4px 9px rgba(11,107,79,.16);
}

.login-error{
  min-height:18px;
  text-align:center;
  color:#d83232;
  font-size:12px;
  margin-top:10px;
}

/* =========================
   APP
========================= */

#app{
  display:none;
  width:100%;
  height:100%;
  overflow:hidden;
}

.app-header{
  height:62px;
  background:#0b6b4f;
  color:#fff;

  display:flex;
  align-items:center;

  padding:0 13px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.14);

  position:relative;
  z-index:20;
}

.header-left{
  min-width:0;
  flex:1;
}

.app-title{
  font-size:18px;
  line-height:20px;
  font-weight:900;
}

.username{
  font-size:10px;
  opacity:.78;
  margin-top:2px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.sync-status{
  font-size:10px;
  white-space:nowrap;
  opacity:.9;
}

.logout-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;

  color:#fff;
  background:rgba(255,255,255,.13);

  font-size:18px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.logout-btn:active{
  background:rgba(255,255,255,.22);
}

/* =========================
   CONTENT
========================= */

.main{
  height:calc(100% - 62px);
  overflow:hidden;
  position:relative;
}

.page{
  display:none;
  height:100%;
  overflow:hidden;
  overflow-x:hidden;

  padding:12px 12px 82px;
  -webkit-overflow-scrolling:touch;
}

.page.active{
  display:block;
}

.container{
  width:100%;
  max-width:520px;
  margin:0 auto;
}

/* =========================
   3D BALANCE CARD
========================= */

.balance-card{
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #15906d 0%,
      #0b6b4f 45%,
      #07523d 100%
    );

  border-radius:20px;

  padding:18px 20px 19px;
  margin-bottom:10px;

  border:1px solid rgba(255,255,255,.20);

  box-shadow:
    0 3px 0 #064735,
    0 6px 0 #053d2f,
    0 12px 18px rgba(0,0,0,.18),
    0 18px 28px rgba(11,107,79,.20),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -10px 20px rgba(0,0,0,.10);
}

.balance-card::before{
  content:"";
  position:absolute;

  left:10px;
  right:10px;
  top:7px;

  height:3px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.52),
      transparent
    );

  box-shadow:
    0 0 8px rgba(255,255,255,.18);

  pointer-events:none;
}

.balance-card::after{
  content:"";

  position:absolute;

  width:175px;
  height:175px;

  right:-74px;
  top:-84px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.18) 0%,
      rgba(255,255,255,.07) 30%,
      transparent 68%
    );

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08);

  pointer-events:none;
}

.balance-label{
  position:relative;
  z-index:2;

  color:rgba(255,255,255,.84);

  font-size:12px;
  font-weight:700;

  margin-bottom:7px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.22);
}

.balance-value{
  position:relative;
  z-index:2;

  color:#fff!important;

  font-size:30px;
  font-weight:900;

  line-height:1.12;
  letter-spacing:-.5px;

  text-shadow:
    0 2px 2px rgba(0,0,0,.20),
    0 4px 8px rgba(0,0,0,.16);
}

.balance-status{
  display:none!important;
}

/* =========================
   FORM CARD
========================= */

.form-card{
  background:#fff;
  border:1px solid #e4ebe8;
  border-radius:18px;

  padding:14px;

  box-shadow:
    0 3px 0 #e0e7e3,
    0 7px 17px rgba(0,0,0,.06);
}

.field{
  margin-bottom:11px;
}

.field-label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:#5f6965;
  margin-bottom:5px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid #dce5e1;
  border-radius:11px;

  background:#f9fbfa;

  outline:none;

  font-size:14px;
  color:#202522;
}

.input,
.select{
  height:44px;
  padding:0 12px;
}

.textarea{
  min-height:70px;
  padding:10px 12px;
  resize:none;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:#0b6b4f;
  background:#fff;
  box-shadow:0 0 0 3px rgba(11,107,79,.07);
}

/* =========================
   TYPE BUTTON
========================= */

.type-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.type-btn{
  height:43px;

  border:1px solid #dce5e1;
  border-radius:11px;

  background:#f7f9f8;
  color:#606a66;

  font-size:13px;
  font-weight:800;
}

.type-btn.active.income{
  background:#e7f6f0;
  border-color:#0b6b4f;
  color:#0b6b4f;
  box-shadow:inset 0 0 0 1px rgba(11,107,79,.08);
}

.type-btn.active.expense{
  background:#fff0f0;
  border-color:#d83232;
  color:#d83232;
  box-shadow:inset 0 0 0 1px rgba(216,50,50,.07);
}

/* =========================
   SAVE
========================= */

.save-btn{
  width:100%;
  height:47px;

  border:0;
  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #15906d,
      #0b6b4f
    );

  color:#fff;

  font-size:14px;
  font-weight:900;

  box-shadow:
    0 3px 0 #064735,
    0 7px 14px rgba(11,107,79,.18);
}

.save-btn:active{
  transform:translateY(2px);

  box-shadow:
    0 1px 0 #064735,
    0 4px 9px rgba(11,107,79,.16);
}

.form-message{
  min-height:17px;
  text-align:center;
  font-size:11px;
  margin-top:8px;
}

.form-message.success{
  color:#0b6b4f;
}

.form-message.error{
  color:#d83232;
}

/* =========================
   HISTORY FILTER
========================= */

#historyPage{
  flex-direction:column;
  overflow:hidden;
}

#historyPage.active{
  display:flex;
}

#historyPage .container{
  height:100%;
  min-height:0;

  display:flex;
  flex-direction:column;
}

.history-card{
  background:#fff;

  border:1px solid #e4ebe8;
  border-radius:17px;

  padding:11px;

  box-shadow:
    0 3px 0 #e0e7e3,
    0 7px 17px rgba(0,0,0,.05);

  height:auto;
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.filter-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:9px;

  flex:0 0 auto;
}

.filter-btn{
  height:38px;

  border:1px solid #dce5e1;
  border-radius:10px;

  background:#f7f9f8;
  color:#66706c;

  font-size:11px;
  font-weight:800;
}

.filter-btn.active{
  background:#0b6b4f;
  border-color:#0b6b4f;
  color:#fff;
}

.history-category-wrap{
  margin-bottom:9px;

  flex:0 0 auto;
}

.history-category-wrap.hidden{
  display:none!important;
}

/* =========================
   TRANSACTION LIST
========================= */

.transaction-list{
  display:flex;
  flex-direction:column;
  gap:7px;

  flex:1;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;

  padding-bottom:2px;
}

.transaction-card{
  position:relative;
  padding:9px 11px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e6ebe9;
  box-shadow:0 2px 5px rgba(0,0,0,.035);
}

.transaction-card.income{
  border-left:3px solid #0b6b4f;
}

.transaction-card.expense{
  border-left:3px solid #d83232;
}

.txn-row-top,
.txn-row-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
}

.txn-row-bottom{
  margin-top:3px;
}

.txn-amount{
  font-size:13px;
  font-weight:900;
  line-height:1.15;
  white-space:nowrap;
}

.transaction-card.income .txn-amount{
  color:#0b6b4f;
}

.transaction-card.expense .txn-amount{
  color:#d83232;
}

.txn-date{
  flex:0 0 auto;
  font-size:10px;
  font-weight:600;
  color:#66706c;
  white-space:nowrap;
}

.txn-info{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:5px;
  overflow:hidden;
  white-space:nowrap;
}

.txn-category{
  font-size:11px;
  font-weight:900;
  color:#252b28;
  flex:0 0 auto;
}

.txn-note-separator{
  font-size:10px;
  color:#a1a9a5;
  flex:0 0 auto;
}

.txn-note{
  font-size:10px;
  color:#747d79;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.txn-type{
  flex:0 0 auto;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.transaction-card.income .txn-type{
  color:#0b6b4f;
}

.transaction-card.expense .txn-type{
  color:#d83232;
}

.empty-state{
  text-align:center;
  padding:35px 15px;
  color:#8a9390;
  font-size:12px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:60px;

  background:rgba(255,255,255,.97);

  border-top:1px solid #e1e8e5;

  box-shadow:
    0 -5px 18px rgba(0,0,0,.07);

  display:flex;

  z-index:50;
}

.nav-btn{
  flex:1;

  border:0;
  background:transparent;

  color:#89928e;

  font-size:10px;
  font-weight:800;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;
}

.nav-icon{
  font-size:19px;
  line-height:19px;
}

.nav-btn.active{
  color:#0b6b4f;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:420px){

  .balance-card{
    padding:16px 17px 18px;
    margin-bottom:9px;
    border-radius:19px;
  }

  .balance-value{
    font-size:28px;
  }

  .form-card{
    padding:12px;
  }

}

@media(max-height:700px){

  .app-header{
    height:58px;
  }

  .main{
    height:calc(100% - 58px);
  }

  .page{
    padding-top:9px;
  }

  .balance-card{
    padding:13px 15px 15px;
    margin-bottom:8px;
  }

  .balance-value{
    font-size:26px;
  }

  .field{
    margin-bottom:8px;
  }

  .input,
  .select{
    height:41px;
  }

  .textarea{
    min-height:58px;
  }

  .save-btn{
    height:44px;
  }

}

/* =========================
   LOADING
========================= */

.loading{
  opacity:.65;
  pointer-events:none;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">৳</div>

    <div class="login-title">
      আমার হিসাব
    </div>

    <div class="login-subtitle">
      সহজে আয়-ব্যয়ের হিসাব রাখুন
    </div>

    <input
      id="usernameInput"
      class="login-input"
      type="text"
      autocomplete="username"
      placeholder="Username"
    >

    <input
      id="passwordInput"
      class="login-input"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button
      id="loginBtn"
      class="login-btn"
      type="button"
    >
      Login
    </button>

    <div id="loginError" class="login-error"></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <header class="app-header">

    <div class="header-left">

      <div class="app-title">
        আমার হিসাব
      </div>

      <div id="usernameDisplay" class="username"></div>

    </div>

    <div class="header-right">

      <div id="syncStatus" class="sync-status">
        Offline
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
        aria-label="Logout"
      >
        🚪
      </button>

    </div>

  </header>


  <main class="main">

    <!-- =========================
         ADD PAGE
    ========================= -->

    <section
      id="addPage"
      class="page active"
    >

      <div class="container">

        <div
          id="kqdsi4"
          class="balance-card"
        >

          <div class="balance-label">
            বর্তমান ব্যালেন্স
          </div>

          <div
            id="balanceValue"
            class="balance-value"
          >
            0 TK
          </div>

          <div
            id="balanceStatus"
            class="balance-status"
          ></div>

        </div>


        <div class="form-card">

          <div class="field">

            <label class="field-label">
              তারিখ
            </label>

            <input
              id="dateInput"
              class="input"
              type="date"
            >

          </div>


          <div class="field">

            <label class="field-label">
              Amount
            </label>

            <input
              id="amountInput"
              class="input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="টাকার পরিমাণ"
            >

          </div>


          <div class="field">

            <label class="field-label">
              হিসাবের ধরন
            </label>

            <div class="type-row">

              <button
                id="incomeBtn"
                class="type-btn income active"
                type="button"
              >
                আয়
              </button>

              <button
                id="expenseBtn"
                class="type-btn expense"
                type="button"
              >
                ব্যয়
              </button>

            </div>

          </div>


          <div class="field">

            <label class="field-label">
              ক্যাটাগরি
            </label>

            <select
              id="categoryInput"
              class="select"
            ></select>

          </div>


          <div class="field">

            <label class="field-label">
              নোট
            </label>

            <textarea
              id="noteInput"
              class="textarea"
              placeholder="প্রয়োজনে কিছু লিখুন"
            ></textarea>

          </div>


          <button
            id="saveBtn"
            class="save-btn"
            type="button"
          >
            হিসাব সংরক্ষণ করুন
          </button>

          <div
            id="formMessage"
            class="form-message"
          ></div>

        </div>

      </div>

    </section>


    <!-- =========================
         HISTORY PAGE
    ========================= -->

    <section
      id="historyPage"
      class="page"
    >

      <div class="container">

        <div class="history-card">

          <div class="filter-row">

            <button
              class="filter-btn active"
              data-filter="all"
              type="button"
            >
              সব
            </button>

            <button
              class="filter-btn"
              data-filter="income"
              type="button"
            >
              আয়
            </button>

            <button
              class="filter-btn"
              data-filter="expense"
              type="button"
            >
              ব্যয়
            </button>

          </div>


          <div
            id="historyCategoryWrap"
            class="history-category-wrap hidden"
          >

            <select
              id="historyCategoryFilter"
              class="select"
            ></select>

          </div>


          <div
            id="transactionList"
            class="transaction-list"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav class="bottom-nav">

    <button
      id="addNavBtn"
      class="nav-btn active"
      type="button"
    >

      <span class="nav-icon">➕</span>
      <span>যোগ করুন</span>

    </button>


    <button
      id="historyNavBtn"
      class="nav-btn"
      type="button"
    >

      <span class="nav-icon">📋</span>
      <span>সকল হিসাব</span>

    </button>

  </nav>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbwywJPWi2Q1sIXA4gLx2r0qb78yByaKZ7RvwmxDEpmqwqUVtCcyMXzuqEWupu50G6Vj/exec";

const APP_NAME = "AmarHisab";

const STORAGE = {
  session: APP_NAME + "_session",
  transactions: APP_NAME + "_transactions",
  pending: APP_NAME + "_pending"
};


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const usernameInput =
  document.getElementById("usernameInput");

const passwordInput =
  document.getElementById("passwordInput");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const usernameDisplay =
  document.getElementById("usernameDisplay");

const syncStatus =
  document.getElementById("syncStatus");

const logoutBtn =
  document.getElementById("logoutBtn");

const addPage =
  document.getElementById("addPage");

const historyPage =
  document.getElementById("historyPage");

const balanceValue =
  document.getElementById("balanceValue");

const balanceStatus =
  document.getElementById("balanceStatus");

const dateInput =
  document.getElementById("dateInput");

const amountInput =
  document.getElementById("amountInput");

const incomeBtn =
  document.getElementById("incomeBtn");

const expenseBtn =
  document.getElementById("expenseBtn");

const categoryInput =
  document.getElementById("categoryInput");

const noteInput =
  document.getElementById("noteInput");

const saveBtn =
  document.getElementById("saveBtn");

const formMessage =
  document.getElementById("formMessage");

const transactionList =
  document.getElementById("transactionList");

const historyCategoryWrap =
  document.getElementById("historyCategoryWrap");

const historyCategoryFilter =
  document.getElementById("historyCategoryFilter");

const addNavBtn =
  document.getElementById("addNavBtn");

const historyNavBtn =
  document.getElementById("historyNavBtn");

const filterButtons =
  document.querySelectorAll(".filter-btn");

/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadLocalData(){

  try{

    const storedSession =
      localStorage.getItem(STORAGE.session);

    const storedTransactions =
      localStorage.getItem(STORAGE.transactions);

    const storedPending =
      localStorage.getItem(STORAGE.pending);


    if(storedSession){

      session =
        JSON.parse(storedSession);

    }


    if(storedTransactions){

      const parsed =
        JSON.parse(storedTransactions);

      if(Array.isArray(parsed)){

        transactions =
          parsed.map(normalizeTransaction);

      }

    }


    if(storedPending){

      const parsed =
        JSON.parse(storedPending);

      if(Array.isArray(parsed)){

        pendingTransactions =
          parsed.map(normalizeTransaction);

      }

    }

  }catch(error){

    console.error(
      "Local data error:",
      error
    );

  }

}

function saveLocalPending(){

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatIndianNumber(value){

  let str =
    String(value ?? "")
      .replace(/[^\d]/g,"");

  if(!str){

    return "0";

  }

  str =
    str.replace(/^0+(?=\d)/,"");

  if(str.length <= 3){

    return str;

  }

  const lastThree =
    str.slice(-3);

  const other =
    str.slice(0,-3);

  return (
    other.replace(
      /\B(?=(\d{2})+(?!\d))/g,
      ","
    )
    + "," +
    lastThree
  );

}


function amountToNumber(value){

  const cleaned =
    String(value ?? "")
      .replace(/,/g,"")
      .replace(/[^\d]/g,"");

  if(!cleaned){

    return 0;

  }

  const number =
    Number(cleaned);

  return Number.isFinite(number)
    ? number
    : 0;

}


function getToday(){

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function formatDate(value){

  if(!value){

    return "";

  }

  const str =
    String(value);

  if(/^\d{4}-\d{2}-\d{2}$/.test(str)){

    const [
      y,
      m,
      d
    ] =
      str.split("-");

    return `${d}/${m}/${y}`;

  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){

    return str;

  }

  const day =
    String(date.getDate())
      .padStart(2,"0");

  const month =
    String(date.getMonth()+1)
      .padStart(2,"0");

  const year =
    date.getFullYear();

  return `${day}/${month}/${year}`;

}


function createTransactionId(){

  return (
    "TXN" +
    Date.now() +
    Math.random()
      .toString(36)
      .slice(2,8)
      .toUpperCase()
  );

}


/* =========================================================
   API
========================================================= */

async function apiPost(payload){

  const response =
    await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    });


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Server response invalid"
    );

  }


  if(data && data.ok === false){

    throw new Error(
      data.message ||
      "Server error"
    );

  }


  return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function doLogin(){

  const username =
    usernameInput.value.trim();

  const password =
    passwordInput.value;


  if(!username){

    loginError.textContent =
      "Username দিন";

    return;

  }


  if(!password){

    loginError.textContent =
      "Password দিন";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.textContent =
    "Login হচ্ছে...";

  loginError.textContent = "";


  try{

    const data =
      await apiPost({
        action:"login",
        username,
        password
      });


    if(!data || data.ok === false){

      throw new Error(
        data?.message ||
        "Login failed"
      );

    }


    session = {
      username:
        data.username ||
        username,

      userId:
        data.userId ||
        data.id ||
        "",

      loginAt:
        Date.now()
    };


    localStorage.setItem(
      STORAGE.session,
      JSON.stringify(session)
    );


    showApp();

    await initializeApp();


  }catch(error){

    console.error(error);

    loginError.textContent =
      error.message ||
      "Login করা যায়নি";

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }

}

function updateCategories(){

      category =>

function getHistoryCategoryList(){

  if(transactionFilter === "income"){

    return INCOME_CATEGORIES;

  }

  if(transactionFilter === "expense"){

    return EXPENSE_CATEGORIES;

  }

  return [];

}


function updateHistoryCategoryFilter(
  force = false
){

  const mode =
    transactionFilter;


  if(
    !force &&
    lastHistoryCategoryFilterMode === mode
  ){

    return;

  }


  lastHistoryCategoryFilterMode =
    mode;


  const categories =
    getHistoryCategoryList();


  if(
    mode === "income" ||
    mode === "expense"
  ){

    historyCategoryWrap
      .classList
      .remove("hidden");


    historyCategoryFilter.innerHTML =
      `<option value="all">সব ক্যাটাগরি</option>` +
      categories.map(
        category =>
          `<option value="${escapeHTML(category)}">
            ${escapeHTML(category)}
          </option>`
      ).join("");


    if(
      categories.includes(categoryFilter)
    ){

      historyCategoryFilter.value =
        categoryFilter;

    }else{

      categoryFilter = "all";

      historyCategoryFilter.value =
        "all";

    }

  }else{

    historyCategoryWrap
      .classList
      .add("hidden");

    categoryFilter = "all";

    historyCategoryFilter.innerHTML = "";

  }

}

/* =========================================================
   BALANCE
========================================================= */

function calculateBalance(){

  let balance = 0;


  for(const tx of transactions){

    const amount =
      Number(tx.amount) || 0;


    if(tx.type === "income"){

      balance += amount;

    }else if(tx.type === "expense"){

      balance -= amount;

    }

  }


  return balance;

}


function renderBalance(){

  const balance =
    calculateBalance();


  const formatted =
    formatIndianNumber(
      Math.abs(balance)
    );


  if(balance >= 0){

    balanceValue.textContent =
      formatted + " TK";

    balanceValue.style.color =
      "#ffffff";

  }else{

    balanceValue.textContent =
      "-" + formatted + " TK";

    balanceValue.style.color =
      "#ffd6d6";

  }

}


/* =========================================================
   SERVER BALANCE
========================================================= */

async function loadServerBalance(){

  try{

    const data =
      await apiPost({
        action:"getBalance"
      });


    let balance = null;


    if(
      typeof data?.balance === "number"
    ){

      balance =
        data.balance;

    }else if(
      typeof data?.data?.balance === "number"
    ){

      balance =
        data.data.balance;

    }


    if(
      typeof balance !== "number" ||
      !Number.isFinite(balance)
    ){

      return;

    }


    const formatted =
      formatIndianNumber(
        Math.abs(balance)
      );


    if(balance >= 0){

      balanceValue.textContent =
        formatted + " TK";

      balanceValue.style.color =
        "#ffffff";

    }else{

      balanceValue.textContent =
        "-" + formatted + " TK";

      balanceValue.style.color =
        "#ffd6d6";

    }

  }catch(error){

    console.log(
      "Server balance unavailable:",
      error
    );

  }

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeType(type){

  const value =
    String(type ?? "")
      .trim()
      .toLowerCase();


  if(
    value === "income" ||
    value === "আয়" ||
    value === "আয়"
  ){

    return "income";

  }


  if(
    value === "expense" ||
    value === "ব্যয়" ||
    value === "ব্যয়"
  ){

    return "expense";

  }


  return "income";

}


function normalizeTransaction(tx){

  return {

    transactionId:
      tx?.transactionId ||
      tx?.id ||
      createTransactionId(),

    date:
      tx?.date ||
      getToday(),

    amount:
      Number(
        tx?.amount ??
        tx?.value ??
        0
      ) || 0,

    type:
      normalizeType(
        tx?.type
      ),

    category:
      tx?.category ||
      "",

    note:
      tx?.note ||
      "",

    createdAt:
      tx?.createdAt ||
      tx?.timestamp ||
      new Date().toISOString()

  };

}


/* =========================================================
   SORT
========================================================= */

function sortTransactions(){

  transactions.sort(
    (a,b)=>{

      const createdA =
        new Date(
          a.createdAt || 0
        ).getTime();

      const createdB =
        new Date(
          b.createdAt || 0
        ).getTime();


      if(createdB !== createdA){

        return createdB - createdA;

      }


      return String(
        b.transactionId || ""
      ).localeCompare(
        String(
          a.transactionId || ""
        )
      );

    }
  );

}

/* =========================================================
   SET FILTER
========================================================= */

function setTransactionFilter(filter){

  transactionFilter =
    filter || "all";

  categoryFilter =
    "all";

  updateHistoryCategoryFilter(
    true
  );

  renderTransactions();

}


/* =========================================================
   FILTERED TRANSACTIONS
========================================================= */

function getFilteredTransactions(){

  let result =
    transactions;


  if(
    transactionFilter !== "all"
  ){

    result =
      result.filter(
        tx =>
          tx.type ===
          transactionFilter
      );

  }


  if(
    categoryFilter !== "all"
  ){

    result =
      result.filter(
        tx =>
          tx.category ===
          categoryFilter
      );

  }


  return result;

}


/* =========================================================
   RENDER SIGNATURE
========================================================= */

function getTransactionRenderSignature(){

  const filtered =
    getFilteredTransactions();


  return JSON.stringify({

    filter:
      transactionFilter,

    category:
      categoryFilter,

    data:
      filtered.map(
        tx => [

          tx.transactionId,
          tx.date,
          tx.amount,
          tx.type,
          tx.category,
          tx.note

        ]
      )

  });

}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions(){

  sortTransactions();

  renderBalance();

  updateFilterButtons();

  updateHistoryCategoryFilter();


  const filtered =
    getFilteredTransactions();


  const signature =
    getTransactionRenderSignature();


  if(
    signature ===
    lastRenderSignature
  ){

    return;

  }


  lastRenderSignature =
    signature;


  if(!filtered.length){

    transactionList.innerHTML =
      `
      <div class="empty-state">
        কোনো হিসাব পাওয়া যায়নি
      </div>
      `;

    return;

  }


  const scrollTop =
    historyPage.scrollTop;


  transactionList.innerHTML =
    filtered.map(
      tx => {

        const amount =
          formatIndianNumber(
            Math.abs(
              Number(tx.amount) || 0
            )
          );


        const isIncome =
          tx.type === "income";


        const typeText =
          isIncome
            ? "আয়"
            : "ব্যয়";


        const sign =
          isIncome
            ? "+"
            : "-";


        return `
<div class="transaction-card ${isIncome ? "income" : "expense"}">

  <div class="txn-row-top">

    <div class="txn-amount">
      ${sign}${amount} TK
    </div>

    <div class="txn-date">
      ${escapeHTML(formatDate(tx.date))}
    </div>

  </div>

  <div class="txn-row-bottom">

    <div class="txn-info">

      <span class="txn-category">
        ${escapeHTML(tx.category || "অন্যান্য")}
      </span>

      ${
        tx.note
          ? `
            <span class="txn-note-separator">•</span>
            <span class="txn-note">
              ${escapeHTML(tx.note)}
            </span>
          `
          : ""
      }

    </div>

    <div class="txn-type">
      ${typeText}
    </div>

  </div>

</div>
`;

      }
    ).join("");


  historyPage.scrollTop =
    scrollTop;

}


/* =========================================================
   LOCAL TRANSACTION
========================================================= */

function addLocalTransaction(tx){

  const exists =
    transactions.some(
      item =>
        item.transactionId ===
        tx.transactionId
    );


  if(!exists){

    transactions.unshift(
      normalizeTransaction(tx)
    );

  }


  saveLocalTransactions();

}


/* =========================================================
   PENDING
========================================================= */

function addPending(tx){

  const exists =
    pendingTransactions.some(
      item =>
        item.transactionId ===
        tx.transactionId
    );


  if(!exists){

    pendingTransactions.push(
      normalizeTransaction(tx)
    );

  }


  saveLocalPending();

}


function removePending(transactionId){

  pendingTransactions =
    pendingTransactions.filter(
      tx =>
        tx.transactionId !==
        transactionId
    );


  saveLocalPending();

}

/* =========================================================
   SAVE TRANSACTION
========================================================= */

async function saveTransaction(){

  if(isSaving){

    return;

  }


  const date =
    dateInput.value;


  const amount =
    amountToNumber(
      amountInput.value
    );


  const category =
    categoryInput.value;


  const note =
    noteInput.value.trim();


  if(!date){

    showFormMessage(
      "তারিখ দিন",
      "error"
    );

    return;

  }


  if(amount <= 0){

    showFormMessage(
      "সঠিক Amount দিন",
      "error"
    );

    amountInput.focus();

    return;

  }


  if(!category){

    showFormMessage(
      "ক্যাটাগরি নির্বাচন করুন",
      "error"
    );

    return;

  }


  const tx = {

    transactionId:
      createTransactionId(),

    date,

    amount,

    type:
      currentType,

    category,

    note,

    createdAt:
      new Date().toISOString()

  };


  isSaving = true;

  saveBtn.classList.add(
    "loading"
  );


  /* Local first */

  addLocalTransaction(tx);

  lastRenderSignature = "";

  renderTransactions();


  amountInput.value = "";

  noteInput.value = "";

  dateInput.value =
    getToday();


  showFormMessage(
    "হিসাব সংরক্ষণ হয়েছে",
    "success"
  );


  /* Server sync */

  if(!navigator.onLine){

    addPending(tx);

    showFormMessage(
      "Offline — পরে Sync হবে",
      "success"
    );

    isSaving = false;

    saveBtn.classList.remove(
      "loading"
    );

    return;

  }


  try{

    await apiPost({

      action:
        "addTransaction",

      transactionId:
        tx.transactionId,

      date:
        tx.date,

      amount:
        tx.amount,

      type:
        tx.type,

      category:
        tx.category,

      note:
        tx.note,

      createdAt:
        tx.createdAt

    });


    removePending(
      tx.transactionId
    );


    setSyncStatus(
      "Synced"
    );


    showFormMessage(
      "হিসাব Sync হয়েছে ✓",
      "success"
    );


    await loadTransactions();


  }catch(error){

    console.error(error);

    addPending(tx);


    setSyncStatus(
      "Pending"
    );


    showFormMessage(
      "Local-এ রাখা হয়েছে — পরে Sync হবে",
      "success"
    );

  }finally{

    isSaving = false;

    saveBtn.classList.remove(
      "loading"
    );

  }

}


/* =========================================================
   PENDING SYNC
========================================================= */

async function syncPending(){

  if(
    !navigator.onLine ||
    !pendingTransactions.length
  ){

    return;

  }


  const pendingCopy =
    [...pendingTransactions];


  for(const tx of pendingCopy){

    try{

      await apiPost({

        action:
          "addTransaction",

        transactionId:
          tx.transactionId,

        date:
          tx.date,

        amount:
          tx.amount,

        type:
          tx.type,

        category:
          tx.category,

        note:
          tx.note,

        createdAt:
          tx.createdAt

      });


      removePending(
        tx.transactionId
      );


    }catch(error){

      console.log(
        "Pending sync failed:",
        error
      );

    }

  }


  if(
    pendingTransactions.length === 0
  ){

    setSyncStatus(
      "Synced"
    );

  }else{

    setSyncStatus(
      "Pending"
    );

  }

}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions(){

  if(!navigator.onLine){

    setSyncStatus(
      "Offline"
    );

    return;

  }


  try{

    setSyncStatus(
      "Syncing..."
    );


    const data =
      await apiPost({

        action:
          "getTransactions"

      });


    let serverTransactions = [];


    if(Array.isArray(data)){

      serverTransactions =
        data;

    }else if(
      Array.isArray(
        data?.transactions
      )
    ){

      serverTransactions =
        data.transactions;

    }else if(
      Array.isArray(
        data?.data
      )
    ){

      serverTransactions =
        data.data;

    }


    const normalized =
      serverTransactions
        .map(normalizeTransaction);


    const pendingIds =
      new Set(
        pendingTransactions.map(
          tx =>
            tx.transactionId
        )
      );


    transactions =
      normalized.filter(
        tx =>
          !pendingIds.has(
            tx.transactionId
          )
      );


    /* Keep pending locally */

    for(
      const pending
      of pendingTransactions
    ){

      const exists =
        transactions.some(
          tx =>
            tx.transactionId ===
            pending.transactionId
        );


      if(!exists){

        transactions.push(
          pending
        );

      }

    }


    saveLocalTransactions();

    lastRenderSignature = "";

    renderTransactions();


    setSyncStatus(
      pendingTransactions.length
        ? "Pending"
        : "Synced"
    );


  }catch(error){

    console.error(error);

    setSyncStatus(
      navigator.onLine
        ? "Offline"
        : "Offline"
    );

    lastRenderSignature = "";

    renderTransactions();

  }

}

/* =========================================================
   AMOUNT INPUT FORMAT
========================================================= */

amountInput.addEventListener(
  "input",
  function(){

    const oldValue =
      this.value;

    const oldCursor =
      this.selectionStart || 0;


    const beforeDigits =
      oldValue
        .slice(0,oldCursor)
        .replace(/[^\d]/g,"")
        .length;


    const digits =
      oldValue
        .replace(/[^\d]/g,"");


    const formatted =
      formatIndianNumber(
        digits
      );


    this.value =
      formatted;


    let cursor =
      formatted.length;


    if(
      beforeDigits > 0
    ){

      let count = 0;

      cursor = 0;


      for(
        let i=0;
        i<formatted.length;
        i++
      ){

        if(/\d/.test(formatted[i])){

          count++;

        }


        cursor = i + 1;


        if(
          count >= beforeDigits
        ){

          break;

        }

      }

    }


    try{

      this.setSelectionRange(
        cursor,
        cursor
      );

    }catch(error){}

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

amountInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      saveTransaction();

    }

  }
);


noteInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      saveTransaction();

    }

  }
);


/* =========================================================
   EVENTS
========================================================= */

loginBtn.addEventListener(
  "click",
  doLogin
);


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      doLogin();

    }

  }
);


usernameInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      passwordInput.focus();

    }

  }
);


logoutBtn.addEventListener(
  "click",
  logout
);


incomeBtn.addEventListener(
  "click",
  function(){

    setType("income");

  }
);


expenseBtn.addEventListener(
  "click",
  function(){

    setType("expense");

  }
);


saveBtn.addEventListener(
  "click",
  saveTransaction
);


addNavBtn.addEventListener(
  "click",
  function(){

    showPage("add");

  }
);


historyNavBtn.addEventListener(
  "click",
  function(){

    showPage("history");

  }
);


filterButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        setTransactionFilter(
          this.dataset.filter
        );

      }
    );

  }
);


historyCategoryFilter.addEventListener(
  "change",
  function(){

    categoryFilter =
      this.value || "all";

    lastRenderSignature = "";

    renderTransactions();

  }
);


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

window.addEventListener(
  "online",
  async function(){

    setSyncStatus(
      "Online"
    );

    await syncPending();

    await loadTransactions();

  }
);


window.addEventListener(
  "offline",
  function(){

    setSyncStatus(
      "Offline"
    );

  }
);


/* =========================================================
   PERIODIC SYNC
========================================================= */

setInterval(
  async function(){

    if(
      !session ||
      !navigator.onLine
    ){

      return;

    }


    await syncPending();

    await loadTransactions();

  },
  10000
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeApp(){

  dateInput.value =
    getToday();


  setType(
    "income"
  );


  categoryFilter =
    "all";


  lastHistoryCategoryFilterMode =
    "";


  lastRenderSignature =
    "";


  updateHistoryCategoryFilter(
    true
  );


  renderTransactions();


  await loadTransactions();


  await syncPending();

}


/* =========================================================
   STARTUP
========================================================= */

loadLocalData();


if(session){

  showApp();

  initializeApp();

}else{

  showLogin();

}

</script>

</html>
