<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>আমার হিসাব</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f4f6f5;
  color:#202423;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  min-height:100dvh;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================
   LOGIN
========================= */

#loginScreen{
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f4f6f5;
  overflow:hidden;
}

.login-box{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:18px;
  padding:28px 22px 24px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-logo{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  border-radius:16px;
  background:#0b6b4f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
}

.login-title{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:5px;
}

.login-subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:24px;
}

.form-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:0 0 7px;
}

.input,
.select,
.note-input{
  width:100%;
  border:1px solid #dfe4e1;
  background:#fafbfa;
  border-radius:11px;
  padding:13px 13px;
  outline:none;
  font-size:15px;
  color:#202423;
}

.input:focus,
.select:focus,
.note-input:focus{
  border-color:#0b6b4f;
  background:#fff;
}

.form-group{
  margin-bottom:15px;
}

.login-btn{
  width:100%;
  border:0;
  border-radius:11px;
  background:#0b6b4f;
  color:#fff;
  padding:14px;
  font-size:16px;
  font-weight:800;
  margin-top:4px;
}

.login-btn:active{
  transform:scale(.99);
}

.login-error{
  color:#d52f2f;
  font-size:13px;
  text-align:center;
  min-height:19px;
  margin-top:12px;
}


/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}


/* =========================
   TOP HEADER
========================= */

.top-header{
  flex:0 0 auto;
  height:67px;
  background:#0b6b4f;
  color:#fff;
  padding:10px 14px;
  position:relative;
  z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.header-row{
  width:100%;
  max-width:520px;
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.app-title{
  font-size:20px;
  font-weight:800;
  line-height:22px;
}

.header-user{
  font-size:11px;
  opacity:.9;
  line-height:15px;
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  justify-content:center;
  gap:2px;
  min-width:70px;
}

#syncStatus{
  min-width:70px;
  text-align:right;
  white-space:nowrap;
  font-size:11px;
  line-height:14px;
}

.header-logout{
  width:30px;
  height:24px;
  padding:0;
  border:0;
  border-radius:7px;
  background:rgba(255,255,255,.14);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.header-logout:active{
  transform:scale(.93);
  background:rgba(255,255,255,.22);
}


/* =========================
   MAIN
========================= */

.main{
  width:100%;
  max-width:520px;
  flex:1 1 auto;
  min-height:0;
  margin:auto;
  padding:10px 12px 8px;
  overflow:hidden;
}


/* =========================
   PAGES
========================= */

#addPage,
#historyPage{
  width:100%;
  height:100%;
  min-height:0;
}

#addPage{
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

#historyPage{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* =========================
   BALANCE
========================= */

.balance-card{
  background:#fff;
  border-radius:15px;
  padding:14px 17px;
  margin-bottom:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.055);
}

.balance-label{
  color:#747b78;
  font-size:13px;
  margin-bottom:4px;
}

.balance-value{
  font-size:27px;
  font-weight:800;
  color:#0b6b4f;
  line-height:1.15;
}

.balance-status{
  margin-top:5px;
  font-size:10px;
  color:#777;
}


/* =========================
   FORM CARD
========================= */

.form-card{
  background:#fff;
  border-radius:15px;
  padding:14px;
  box-shadow:0 2px 9px rgba(0,0,0,.055);
}

.form-card .form-group{
  margin-bottom:11px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:12px;
}

.type-btn{
  border:1px solid #dfe4e1;
  background:#fafbfa;
  color:#555;
  border-radius:10px;
  padding:10px;
  font-size:15px;
  font-weight:800;
}

.type-btn.active-income{
  background:#e8f5ef;
  color:#0b6b4f;
  border-color:#0b6b4f;
}

.type-btn.active-expense{
  background:#fff0f0;
  color:#c72e2e;
  border-color:#c72e2e;
}

.amount-wrap{
  position:relative;
}

.amount-input{
  width:100%;
  border:1px solid #dfe4e1;
  background:#fafbfa;
  border-radius:11px;
  padding:12px 55px 12px 13px;
  outline:none;
  font-size:19px;
  font-weight:700;
  text-align:left;
}

.amount-input:focus{
  border-color:#0b6b4f;
  background:#fff;
}

.amount-currency{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  font-weight:700;
  font-size:13px;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:11px;
  background:#0b6b4f;
  color:#fff;
  padding:12px;
  font-size:16px;
  font-weight:800;
  margin-top:2px;
}

.save-btn:disabled{
  opacity:.6;
}

.form-message{
  min-height:18px;
  text-align:center;
  font-size:12px;
  margin-top:8px;
}

.form-message.success{
  color:#16824f;
}

.form-message.error{
  color:#d52f2f;
}


/* =========================
   TRANSACTION FILTER
========================= */

.transaction-filter{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-bottom:8px;
}

.filter-btn{
  border:1px solid #dfe4e1;
  background:#fff;
  color:#666;
  border-radius:9px;
  padding:8px 5px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 1px 4px rgba(0,0,0,.035);
}

.filter-btn.active{
  background:#0b6b4f;
  color:#fff;
  border-color:#0b6b4f;
}

.filter-btn.expense-active{
  background:#d83232;
  color:#fff;
  border-color:#d83232;
}


/* =========================
   HISTORY CATEGORY FILTER
========================= */

.history-category-filter{
  flex:0 0 auto;
  width:100%;
  margin-bottom:8px;
}


/* =========================
   SCROLLABLE TRANSACTION AREA
========================= */

.history-list{
  flex:1 1 auto;
  min-height:0;

  display:flex;
  flex-direction:column;
  gap:5px;

  overflow-y:auto;
  overflow-x:hidden;

  padding-right:2px;
  padding-bottom:3px;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.history-list::-webkit-scrollbar{
  width:4px;
}

.history-list::-webkit-scrollbar-track{
  background:transparent;
}

.history-list::-webkit-scrollbar-thumb{
  background:#cfd6d2;
  border-radius:10px;
}

.empty-box{
  background:#fff;
  border-radius:13px;
  padding:28px 15px;
  text-align:center;
  color:#888;
  font-size:14px;
  flex-shrink:0;
}


/* =========================
   COMPACT TRANSACTION CARD
========================= */

.txn-card{
  background:#fff;
  border-radius:9px;
  padding:7px 10px 7px;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  border-left:3px solid #0b6b4f;
  flex-shrink:0;
}

.txn-card.expense{
  border-left-color:#d83232;
}

.txn-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.txn-date{
  font-size:10px;
  color:#777;
  font-weight:600;
}

.txn-type{
  font-size:10px;
  font-weight:800;
}

.txn-type.income{
  color:#0b6b4f;
}

.txn-type.expense{
  color:#d83232;
}

.txn-amount{
  font-size:17px;
  line-height:1.1;
  font-weight:800;
  margin:3px 0 3px;
}

.txn-amount.income{
  color:#0b6b4f;
}

.txn-amount.expense{
  color:#d83232;
}

.txn-bottom{
  font-size:11px;
  color:#4e5653;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.txn-category{
  font-weight:700;
}

.txn-note{
  color:#777;
}

.txn-dot{
  padding:0 3px;
  color:#aaa;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:25px 10px;
  color:#888;
  font-size:13px;
}

.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #ddd;
  border-top-color:#0b6b4f;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:-3px;
  margin-right:5px;
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  flex:0 0 auto;
  width:100%;
  height:60px;
  background:#fff;
  border-top:1px solid #e4e7e5;
  display:flex;
  justify-content:center;
  z-index:30;
}

.nav-inner{
  width:100%;
  max-width:520px;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
}

.nav-btn{
  border:0;
  background:#fff;
  color:#777;
  font-size:12px;
  font-weight:700;
}

.nav-icon{
  display:block;
  font-size:19px;
  line-height:21px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#0b6b4f;
}


/* =========================
   OLD LOGOUT HIDDEN
========================= */

.logout-row{
  display:none!important;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

  .top-header{
    height:63px;
    padding:8px 11px;
  }

  .main{
    padding-left:9px;
    padding-right:9px;
    padding-top:8px;
  }

  .app-title{
    font-size:18px;
  }

  .balance-card{
    padding:12px 15px;
    margin-bottom:8px;
  }

  .balance-value{
    font-size:25px;
  }

  .form-card{
    padding:12px;
  }

  .form-card .form-group{
    margin-bottom:9px;
  }

  .form-label{
    font-size:12px;
    margin-bottom:5px;
  }

  .input,
  .select,
  .note-input{
    padding:10px 11px;
    font-size:14px;
  }

  .amount-input{
    padding:11px 50px 11px 12px;
    font-size:18px;
  }

  .type-btn{
    padding:9px;
  }

  .save-btn{
    padding:11px;
  }

  .bottom-nav{
    height:58px;
  }

  .txn-amount{
    font-size:16px;
  }

}


/* =========================
   VERY SMALL HEIGHT PHONE
========================= */

@media(max-height:700px){

  .top-header{
    height:59px;
    padding-top:7px;
    padding-bottom:7px;
  }

  .main{
    padding-top:6px;
    padding-bottom:5px;
  }

  .balance-card{
    padding:10px 14px;
    margin-bottom:7px;
  }

  .balance-value{
    font-size:24px;
  }

  .balance-status{
    margin-top:3px;
    font-size:9px;
  }

  .form-card{
    padding:11px;
  }

  .form-card .form-group{
    margin-bottom:8px;
  }

  .type-buttons{
    margin-bottom:9px;
  }

  .type-btn{
    padding:8px;
  }

  .input,
  .select,
  .note-input{
    padding:9px 10px;
  }

  .amount-input{
    padding:10px 50px 10px 11px;
    font-size:17px;
  }

  .save-btn{
    padding:10px;
  }

  .bottom-nav{
    height:55px;
  }

  .nav-icon{
    font-size:17px;
    line-height:19px;
  }

}
</style>
</head>

<body>

<section id="loginScreen">

  <div class="login-box">

    <div class="login-logo">৳</div>

    <div class="login-title">আমার হিসাব</div>

    <div class="login-subtitle">
      আপনার Username এবং Password দিয়ে Login করুন
    </div>

    <div class="form-group">

      <label class="form-label">
        Username
      </label>

      <input
        id="loginUsername"
        class="input"
        type="text"
        autocomplete="username"
        placeholder="Username">

    </div>

    <div class="form-group">

      <label class="form-label">
        Password
      </label>

      <input
        id="loginPassword"
        class="input"
        type="password"
        autocomplete="current-password"
        placeholder="Password">

    </div>

    <button
      id="loginBtn"
      class="login-btn">
      Login
    </button>

    <div
      id="loginError"
      class="login-error">
    </div>

  </div>

</section>


<section id="app" class="hidden">

  <header class="top-header">

    <div class="header-row">

      <div>

        <div class="app-title">
          আমার হিসাব
        </div>

        <div
          id="headerUsername"
          class="header-user">
        </div>

      </div>


      <!-- Sync + Logout -->

      <div class="header-right">

        <div
          id="syncStatus"
          class="header-user">
          Offline
        </div>

        <button
          id="logoutBtn"
          class="header-logout"
          type="button"
          aria-label="Logout"
          title="Logout">
          🚪
        </button>

      </div>

    </div>

  </header>


  <main class="main">

    <section id="addPage">

      <div class="balance-card">

        <div class="balance-label">
          বর্তমান ব্যালেন্স
        </div>

        <div
          id="balanceValue"
          class="balance-value">
          0 TK
        </div>

        <div
          id="balanceStatus"
          class="balance-status">
          হিসাব লোড হচ্ছে...
        </div>

      </div>


      <div class="form-card">

        <div class="form-group">

          <label class="form-label">
            তারিখ
          </label>

          <input
            id="dateInput"
            class="input"
            type="date">

        </div>


        <div class="form-group">

          <label class="form-label">
            Amount
          </label>

          <div class="amount-wrap">

            <input
              id="amountInput"
              class="amount-input"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="0">

            <span class="amount-currency">
              TK
            </span>

          </div>

        </div>


        <div class="form-group">

          <label class="form-label">
            ধরন
          </label>

          <div class="type-buttons">

            <button
              id="incomeBtn"
              class="type-btn active-income"
              type="button">
              + আয়
            </button>

            <button
              id="expenseBtn"
              class="type-btn"
              type="button">
              − ব্যয়
            </button>

          </div>

        </div>


        <div class="form-group">

          <label class="form-label">
            Category
          </label>

          <select
            id="categorySelect"
            class="select">
          </select>

        </div>


        <div class="form-group">

          <label class="form-label">
            Note
          </label>

          <textarea
            id="noteInput"
            class="note-input"
            rows="2"
            placeholder="প্রয়োজনে কিছু লিখুন..."></textarea>

        </div>


        <button
          id="saveBtn"
          class="save-btn"
          type="button">
          Save
        </button>

        <div
          id="formMessage"
          class="form-message">
        </div>

      </div>

    </section>


    <section
      id="historyPage"
      class="hidden">

      <div class="transaction-filter">

        <button
          id="filterAll"
          class="filter-btn active"
          type="button">
          সব
        </button>

        <button
          id="filterIncome"
          class="filter-btn"
          type="button">
          আয়
        </button>

        <button
          id="filterExpense"
          class="filter-btn"
          type="button">
          ব্যয়
        </button>

      </div>


      <select
        id="historyCategoryFilter"
        class="select history-category-filter">

        <option value="all">
          সব ক্যাটাগরি
        </option>

      </select>


      <div
        id="historyList"
        class="history-list">

        <div class="loading">

          <span class="spinner"></span>

          লেনদেন লোড হচ্ছে...

        </div>

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <div class="nav-inner">

      <button
        id="navAdd"
        class="nav-btn active"
        type="button">

        <span class="nav-icon">
          ＋
        </span>

        যোগ করুন

      </button>


      <button
        id="navHistory"
        class="nav-btn"
        type="button">

        <span class="nav-icon">
          ☷
        </span>

        সকল হিসাব

      </button>

    </div>

  </nav>

</section>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbwywJPWi2Q1sIXA4gLx2r0qb78yByaKZ7RvwmxDEpmqwqUVtCcyMXzuqEWupu50G6Vj/exec";

const APP_NAME =
  "AmarHisab";

const STORAGE = {

  pending:
    APP_NAME + "_pending"

};


/* =========================================================
   CATEGORIES
========================================================= */

const INCOME_CATEGORIES = [

  "বেতন",

  "প্রফিট",
  "অন্যান্য"

];


const EXPENSE_CATEGORIES = [

  "বিকাশ",
  "ফ্যামিলি",
  "ব্যবসা",
  "বিল",
  "ব্যাংক ডিপোজিট",
  "অনলাইন অর্ডার",
  "অন্যান্য"

];


/* =========================================================
   STATE
========================================================= */

let currentType =
  "income";

let transactions =
  [];

let pendingTransactions =
  [];

let session =
  null;

let isSaving =
  false;


/* =========================================================
   TRANSACTION FILTER STATE
========================================================= */

let transactionFilter =
  "all";

let categoryFilter =
  "all";


/* =========================================================
   HISTORY DROPDOWN STATE
========================================================= */

let lastHistoryCategoryFilterMode =
  "";


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const loginUsername =
  document.getElementById(
    "loginUsername"
  );

const loginPassword =
  document.getElementById(
    "loginPassword"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const headerUsername =
  document.getElementById(
    "headerUsername"
  );

const syncStatus =
  document.getElementById(
    "syncStatus"
  );

const balanceValue =
  document.getElementById(
    "balanceValue"
  );

const balanceStatus =
  document.getElementById(
    "balanceStatus"
  );

const dateInput =
  document.getElementById(
    "dateInput"
  );

const amountInput =
  document.getElementById(
    "amountInput"
  );

const incomeBtn =
  document.getElementById(
    "incomeBtn"
  );

/* =========================================================

========================================================= */

function loadLocalData(){

  try{

    const savedSession =
      localStorage.getItem(
        STORAGE.session
      );

    if(savedSession){

      session =
        JSON.parse(
          savedSession
        );

    }

  }catch(e){

    session =

  }


  try{

    const savedTransactions =
      localStorage.getItem(
        STORAGE.transactions
      );

    transactions =
      savedTransactions
      ? JSON.parse(
          savedTransactions

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function formatIndianNumber(value){

  let raw =
    String(
      value ?? ""
    )
    .replace(
      /[^\d]/g,
      ""
    );

  if(!raw){

    return "0";

  }

  raw =
    raw.replace(
      /^0+(?=\d)/,
      ""
    );

  if(raw.length <= 3){

    return raw;

  }

  const last3 =
    raw.slice(-3);

  let rest =
    raw.slice(0,-3);

  let result =
    "";

  while(rest.length > 2){

    result =
      "," +
      rest.slice(-2) +
      result;

    rest =
      rest.slice(0,-2);

  }

  return (
    rest +
    result +
    "," +
    last3
  );

}


function amountToNumber(value){

  const raw =
    String(
      value ?? ""
    )
    .replace(
      /[^\d]/g,
      ""
    );

  if(!raw){

    return 0;

  }

  return Number(raw);

}


/* =========================================================
   DATE
========================================================= */

function getToday(){

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );

  return (
    `${year}-${month}-${day}`
  );

}


function formatDate(value){

  if(!value){

    return "";

  }

  const text =
    String(value);

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ){

    const parts =
      text.split("-");

    return (
      `${parts[2]}-${parts[1]}-${parts[0]}`
    );

  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return text;

  }

  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );

  const month =
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    );

  const year =
    d.getFullYear();

  return (
    `${day}-${month}-${year}`
  );

}


/* =========================================================
   TRANSACTION ID
========================================================= */

function createTransactionId(){

  return (
    "TXN" +
    Date.now()
      .toString(36)
      .toUpperCase() +
    Math.random()
      .toString(36)
      .slice(2,7)
      .toUpperCase()
  );

}


/* =========================================================
   API
========================================================= */

async function apiPost(payload){

  const response =
    await fetch(
      API,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            payload
          )

      }
    );

  const text =
    await response.text();

  let data;

  try{

    data =
      JSON.parse(
        text
      );

  }catch(e){

    throw new Error(
      "Server response বুঝতে সমস্যা হয়েছে"
    );

  }

  if(
    data &&
    data.ok === false
  ){

    throw new Error(
      data.message ||
      data.error ||
      "Request failed"
    );

  }

  return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function doLogin(){

  const username =
    loginUsername.value.trim();

  const password =
    loginPassword.value;

  if(!username){

    loginError.textContent =
      "Username দিন";

    return;

  }

  if(!password){

    loginError.textContent =
      "Password দিন";

    return;

  }


  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "Login হচ্ছে...";

  loginError.textContent =
    "";


  try{

    const data =
      await apiPost({

        action:
          "login",

        username:
          username,

        password:
          password

      });


    if(
      !data ||
      data.ok === false
    ){

      throw new Error(
        data?.message ||
        "Username অথবা Password ভুল"
      );

    }


    session = {

      username:
        data.username ||
        username,

      userId:
        data.userId ||
        data.id ||
        "",

      loginAt:
        Date.now()

    };


    localStorage.setItem(

      STORAGE.session,

      JSON.stringify(
        session
      )

    );


    showApp();

    await initializeApp();


  }catch(error){

    console.error(
      error
    );

    loginError.textContent =
      error.message ||
      "Login করা যায়নি";

  }finally{

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Login";

  }

}

========================================================= */

function getHistoryCategoryList(){

  if(
    transactionFilter === "income"
  ){

    return INCOME_CATEGORIES;

  }

  if(
    transactionFilter === "expense"
  ){

    return EXPENSE_CATEGORIES;

  }

  return [
    ...new Set([
      ...INCOME_CATEGORIES,
      ...EXPENSE_CATEGORIES
    ])
  ];

}


function updateHistoryCategoryFilter(
  force = false
){

  const mode =
    transactionFilter;


  if(
    !force &&
    mode ===
    lastHistoryCategoryFilterMode
  ){

    return;

  }


  const list =
    getHistoryCategoryList();


  if(
    categoryFilter !== "all" &&
    !list.includes(
      categoryFilter
    )
  ){

    categoryFilter =
      "all";

  }


  const currentValue =
    categoryFilter;


  const optionsHTML =
    `<option value="all">
      সব Category
    </option>` +

    list
      .map(
        category =>
          `<option value="${escapeHTML(category)}">
            ${escapeHTML(category)}
          </option>`
      )
      .join("");


  historyCategoryFilter.innerHTML =
    optionsHTML;


  historyCategoryFilter.value =
    currentValue;


  lastHistoryCategoryFilterMode =
    mode;

}

/* =========================================================
   BALANCE
========================================================= */

function calculateBalance(){

  let balance =
    0;

  transactions.forEach(
    tx => {

      const amount =
        Number(
          tx.amount
        ) || 0;

      const type =
        normalizeType(
          tx.type
        );

      if(
        type === "income"
      ){

        balance +=
          amount;

      }else if(
        type === "expense"
      ){

        balance -=
          amount;

      }

    }
  );

  return balance;

}


function renderBalance(){

  const balance =
    calculateBalance();

  const formatted =
    formatIndianNumber(
      Math.abs(
        balance
      )
    );


  if(balance >= 0){

    balanceValue.textContent =
      formatted +
      " TK";

    balanceValue.style.color =
      "#0b6b4f";

  }else{

    balanceValue.textContent =
      "-" +
      formatted +
      " TK";

    balanceValue.style.color =
      "#d83232";

  }


  balanceStatus.textContent =
    transactions.length +
    "টি লেনদেন • Local data";

}


/* =========================================================
   NORMALIZE TYPE
========================================================= */

function normalizeType(type){

  const value =
    String(
      type ?? ""
    )
    .trim()
    .toLowerCase();

  if(

    value === "income" ||
    value === "আয়" ||
    value === "আয়"

  ){

    return "income";

  }

  if(

    value === "expense" ||
    value === "ব্যয়" ||
    value === "ব্যয়"

  ){

    return "expense";

  }

  return value;

}


/* =========================================================
   TRANSACTION NORMALIZATION
========================================================= */

function normalizeTransaction(tx){

  return {

    transactionId:
      tx.transactionId ||
      tx.TransactionID ||
      tx.id ||
      "",

    date:
      tx.date ||
      tx.Date ||
      "",

    amount:
      Number(
        tx.amount ??
        tx.Amount ??
        0
      ),

    type:
      normalizeType(
        tx.type ??
        tx.Type ??
        ""
      ),

    category:
      tx.category ??
      tx.Category ??
      "",

    note:
      tx.note ??
      tx.Note ??
      "",

    createdAt:
      tx.createdAt ??
      tx.CreatedAt ??
      ""

  };

}


/* =========================================================
   TRANSACTION SORT
========================================================= */

function sortTransactions(){

  transactions.sort(
    (a,b) => {

      const dateA =
        new Date(
          a.createdAt ||
          a.date ||
          0
        ).getTime();

      const dateB =
        new Date(
          b.createdAt ||
          b.date ||
          0
        ).getTime();

      if(
        dateB !== dateA
      ){

        return (
          dateB -
          dateA
        );

      }

      return String(
        b.transactionId ||
        ""
      ).localeCompare(
        String(
          a.transactionId ||
          ""
        )
      );

    }
  );

}

   SET TRANSACTION FILTER
========================================================= */

function setTransactionFilter(
  filter
){

  transactionFilter =
    filter;

  categoryFilter =
    "all";

  updateFilterButtons();

  updateHistoryCategoryFilter(
    true
  );

  renderTransactions();

}


/* =========================================================
   GET FILTERED TRANSACTIONS
========================================================= */

function getFilteredTransactions(){

  return transactions.filter(
    tx => {

      const type =
        normalizeType(
          tx.type
        );


      const typeMatch =
        transactionFilter === "all" ||
        type === transactionFilter;


      const txCategory =
        String(
          tx.category || ""
        ).trim();


      const categoryMatch =
        categoryFilter === "all" ||
        txCategory ===
        categoryFilter;


      return (
        typeMatch &&
        categoryMatch
      );

    }
  );

}


/* =========================================================
   TRANSACTION RENDER SIGNATURE
   Prevents unnecessary redraw / flicker
========================================================= */

let lastRenderSignature =
  "";


function getTransactionRenderSignature(){

  return transactions
    .map(
      tx =>
        [
          tx.transactionId,
          tx.date,
          tx.amount,
          normalizeType(tx.type),
          tx.category,
          tx.note,
          tx.createdAt
        ].join("|")
    )
    .join("||");

}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions(){

  sortTransactions();


  const renderSignature =
    transactionFilter +
    "|" +
    categoryFilter +
    "|" +
    getTransactionRenderSignature();


  /*
    Data/filter একই থাকলে
    DOM আর rebuild হবে না।

    এতে প্রতি 10 সেকেন্ডের scan-এর সময়
    page blink/jump করবে না।
  */

  if(
    renderSignature ===
    lastRenderSignature
  ){

    return;

  }


  lastRenderSignature =
    renderSignature;


  renderBalance();

  updateFilterButtons();

  updateHistoryCategoryFilter(
    false
  );


  const previousScrollTop =
    historyList.scrollTop;


  const filteredTransactions =
    getFilteredTransactions();


  if(
    !filteredTransactions.length
  ){

    if(
      transactionFilter ===
      "income"
    ){

      if(
        categoryFilter !==
        "all"
      ){

        historyList.innerHTML =
          `<div class="empty-box">
            এই Category-তে কোনো আয় পাওয়া যায়নি
          </div>`;

      }else{

        historyList.innerHTML =
          `<div class="empty-box">
            কোনো আয় পাওয়া যায়নি
          </div>`;

      }

    }else if(
      transactionFilter ===
      "expense"
    ){

      if(
        categoryFilter !==
        "all"
      ){

        historyList.innerHTML =
          `<div class="empty-box">
            এই Category-তে কোনো ব্যয় পাওয়া যায়নি
          </div>`;

      }else{

        historyList.innerHTML =
          `<div class="empty-box">
            কোনো ব্যয় পাওয়া যায়নি
          </div>`;

      }

    }else if(
      categoryFilter !==
      "all"
    ){

      historyList.innerHTML =
        `<div class="empty-box">
          এই Category-তে কোনো লেনদেন নেই
        </div>`;

    }else{

      historyList.innerHTML =
        `<div class="empty-box">
          এখনো কোনো লেনদেন নেই
        </div>`;

    }


    historyList.scrollTop =
      0;

    return;

  }


  historyList.innerHTML =
    filteredTransactions
      .map(
        tx => {

          const type =
            normalizeType(
              tx.type
            );

          const income =
            type ===
            "income";

          const amount =
            formatIndianNumber(
              Math.abs(
                Number(
                  tx.amount
                ) || 0
              )
            );


          const category =
            escapeHTML(
              tx.category ||
              ""
            );

          const note =
            escapeHTML(
              tx.note ||
              ""
            );


          const bottom =
            note

            ? `<span class="txn-category">
                 ${category}
               </span>
               <span class="txn-dot">
                 •
               </span>
               <span class="txn-note">
                 ${note}
               </span>`

            : `<span class="txn-category">
                 ${category}
               </span>`;


          return `

            <div class="txn-card ${
              income
              ? ""
              : "expense"
            }">

              <div class="txn-top">

                <div class="txn-date">
                  ${escapeHTML(
                    formatDate(
                      tx.date
                    )
                  )}
                </div>

                <div class="txn-type ${
                  income
                  ? "income"
                  : "expense"
                }">

                  ${
                    income
                    ? "আয়"
                    : "ব্যয়"
                  }

                </div>

              </div>


              <div class="txn-amount ${
                income
                ? "income"
                : "expense"
              }">

                ${
                  income
                  ? "+"
                  : "-"
                }

                ${amount} TK

              </div>


              <div class="txn-bottom">

                ${bottom}

              </div>

            </div>

          `;

        }
      )
      .join("");


  /*
    Transaction list redraw হলেও
    আগের scroll position ধরে রাখবে।
  */

  historyList.scrollTop =
    previousScrollTop;

}


/* =========================================================
   LOCAL ADD
========================================================= */

function addLocalTransaction(tx){

  const exists =
    transactions.some(
      item =>
        item.transactionId ===
        tx.transactionId
    );

  if(!exists){

    transactions.unshift(
      tx
    );

    saveLocalTransactions();

  }

}


/* =========================================================
   PENDING
========================================================= */

function addPending(tx){

  const exists =
    pendingTransactions.some(
      item =>
        item.transactionId ===
        tx.transactionId
    );

  if(!exists){

    pendingTransactions.push(
      tx
    );

    saveLocalPending();

  }

}


function removePending(
  transactionId
){

  pendingTransactions =
    pendingTransactions.filter(
      tx =>
        tx.transactionId !==
        transactionId
    );

  saveLocalPending();

}


/* =========================================================
   SAVE TRANSACTION
========================================================= */

async function saveTransaction(){

  if(isSaving){

    return;

  }


  const date =
    dateInput.value;

  const amount =
    amountToNumber(
      amountInput.value
    );

  const category =
    categorySelect.value;

  const note =
    noteInput.value.trim();


  if(!date){

    showFormMessage(
      "তারিখ নির্বাচন করুন",
      "error"
    );

    return;

  }


  if(
    !amount ||
    amount <= 0
  ){

    showFormMessage(
      "সঠিক Amount দিন",
      "error"
    );

    amountInput.focus();

    return;

  }


  if(!category){

    showFormMessage(
      "Category নির্বাচন করুন",
      "error"
    );

    return;

  }


  const tx = {

    transactionId:
      createTransactionId(),

    date:
      date,

    amount:
      amount,

    type:
      currentType,

    category:
      category,

    note:
      note,

    createdAt:
      new Date().toISOString()

  };


  addLocalTransaction(
    tx
  );

  renderTransactions();


  amountInput.value =
    "";

  noteInput.value =
    "";

  dateInput.value =
    getToday();


  showFormMessage(
    "লেনদেন Local-এ Save হয়েছে",
    "success"
  );


  isSaving =
    true;

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "Sync হচ্ছে...";


  setSyncStatus(
    "Syncing..."
  );


  try{

    const data =
      await apiPost({

        action:
          "addTransaction",

        transactionId:
          tx.transactionId,

        date:
          tx.date,

        amount:
          tx.amount,

        type:
          tx.type,

        category:
          tx.category,

        note:
          tx.note,

        createdAt:
          tx.createdAt

      });


    if(
      data &&
      data.ok === false
    ){

      throw new Error(
        data.message ||
        "Server save failed"
      );

    }


    removePending(
      tx.transactionId
    );


    showFormMessage(
      "✓ Google Sheets-এ Save হয়েছে",
      "success"
    );


    setSyncStatus(
      "Synced"
    );


  }catch(error){

    console.error(
      error
    );


    addPending(
      tx
    );


    showFormMessage(
      "Local-এ রাখা হয়েছে • Internet হলে Sync হবে",
      "success"
    );


    setSyncStatus(
      "Pending"
    );

  }finally{

    isSaving =
      false;

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "Save";

  }

}


/* =========================================================
   SYNC PENDING
========================================================= */

async function syncPending(){

  if(
    !pendingTransactions.length
  ){

    setSyncStatus(
      "Synced"
    );

    return;

  }


  setSyncStatus(
    "Syncing..."
  );


  const list =
    [
      ...pendingTransactions
    ];


  for(
    const tx of list
  ){

    try{

      const data =
        await apiPost({

          action:
            "addTransaction",

          transactionId:
            tx.transactionId,

          date:
            tx.date,

          amount:
            tx.amount,

          type:
            tx.type,

          category:
            tx.category,

          note:
            tx.note,

          createdAt:
            tx.createdAt

        });


      if(
        data &&
        data.ok === false
      ){

        throw new Error(
          data.message ||
          "Sync failed"
        );

      }


      removePending(
        tx.transactionId
      );


    }catch(error){

      console.warn(
        "Pending sync failed",
        error
      );

      break;

    }

  }


  if(
    pendingTransactions.length
  ){

    setSyncStatus(
      "Pending"
    );

  }else{

    setSyncStatus(
      "Synced"
    );

  }

}


/* =========================================================
   LOAD TRANSACTIONS FROM SHEETS
========================================================= */

async function loadTransactions(){

  try{

    setSyncStatus(
      "Syncing..."
    );


    const data =
      await apiPost({

        action:
          "getTransactions"

      });


    if(
      data &&
      data.ok === false
    ){

      throw new Error(
        data.message ||
        "Transactions load failed"
      );

    }


    let serverTransactions =
      [];


    if(
      Array.isArray(
        data
      )
    ){

      serverTransactions =
        data;

    }else if(
      Array.isArray(
        data.transactions
      )
    ){

      serverTransactions =
        data.transactions;

    }else if(
      Array.isArray(
        data.data
      )
    ){

      serverTransactions =
        data.data;

    }


    const normalized =
      serverTransactions
        .map(
          normalizeTransaction
        )
        .filter(
          tx =>
            tx.transactionId
        );


    const pendingIds =
      new Set(
        pendingTransactions.map(
          tx =>
            tx.transactionId
        )
      );


    const merged =
      normalized.filter(
        tx =>
          !pendingIds.has(
            tx.transactionId
          )
      );


    pendingTransactions.forEach(
      pendingTx => {

        const exists =
          merged.some(
            tx =>
              tx.transactionId ===
              pendingTx.transactionId
          );

        if(!exists){

          merged.push(
            pendingTx
          );

        }

      }
    );


    transactions =
      merged;


    saveLocalTransactions();

    renderTransactions();


    setSyncStatus(
      "Synced"
    );


  }catch(error){

    console.warn(
      "Could not load server transactions",
      error
    );


    renderTransactions();


    setSyncStatus(
      "Offline"
    );

  }

}


/* =========================================================
   BALANCE FROM SERVER
========================================================= */

async function loadServerBalance(){

  try{

    const data =
      await apiPost({

        action:
          "getBalance"

      });


    if(
      data &&
      data.ok === false
    ){

      return;

    }


    let balance =
      null;


    if(
      typeof data.balance ===
      "number"
    ){

      balance =
        data.balance;

    }else if(
      data.data &&
      typeof data.data.balance ===
      "number"
    ){

      balance =
        data.data.balance;

    }


    if(
      balance !== null
    ){

      const formatted =
        formatIndianNumber(
          Math.abs(
            balance
          )
        );


      balanceValue.textContent =
        balance >= 0
        ? formatted + " TK"
        : "-" + formatted + " TK";


      balanceValue.style.color =
        balance >= 0
        ? "#0b6b4f"
        : "#d83232";

    }

  }catch(error){

    console.warn(
      "Balance API error",
      error
    );

  }

}


/* =========================================================
   SYNC STATUS
========================================================= */

function setSyncStatus(
  status
){

  syncStatus.textContent =
    status;

}


/* =========================================================
   FORM MESSAGE
========================================================= */

function showFormMessage(
  message,
  type
){

  formMessage.textContent =
    message;

  formMessage.className =
    "form-message " +
    type;


  clearTimeout(
    showFormMessage.timer
  );


  showFormMessage.timer =
    setTimeout(
      () => {

        formMessage.textContent =
          "";

        formMessage.className =
          "form-message";

      },
      3500
    );

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function showPage(
  page
){

  if(
    page === "add"
  ){

    addPage.classList.remove(
      "hidden"
    );

    historyPage.classList.add(
      "hidden"
    );

    navAdd.classList.add(
      "active"
    );

    navHistory.classList.remove(
      "active"
    );

  }else{

    addPage.classList.add(
      "hidden"
    );

    historyPage.classList.remove(
      "hidden"
    );

    navAdd.classList.remove(
      "active"
    );

    navHistory.classList.add(
      "active"
    );


    renderTransactions();

  }

}

/* =========================================================
   AMOUNT INPUT LIVE FORMAT
========================================================= */

amountInput.addEventListener(
  "input",
  function(){

    const cursorEnd =
      this.selectionStart;

    const before =
      this.value;

    const digitsBeforeCursor =
      before
        .slice(
          0,
          cursorEnd
        )
        .replace(
          /[^\d]/g,
          ""
        )
        .length;


    const raw =
      before.replace(
        /[^\d]/g,
        ""
      );


    const formatted =
      formatIndianNumber(
        raw
      );


    this.value =
      raw
      ? formatted
      : "";


    let position =
      0;

    let digitCount =
      0;

    while(

      position <
      this.value.length &&

      digitCount <
      digitsBeforeCursor

    ){

      if(
        /\d/.test(
          this.value[position]
        )
      ){

        digitCount++;

      }

      position++;

    }


    this.setSelectionRange(
      position,
      position
    );

  }
);
